<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <!--use as much of flashcss as possible-->
        <script src="quiz.js" defer></script>
    </head>
    <body>
        <h1>Matching Quiz</h1> <!-- other options later -->
        <a href="index.html"><button class="home">Home</button></a> <!--SAVED.HTML-->
        <!--setting for later: number of q's-->

        <!-- quiz -->
        <!-- duolingo style. color when selected and in response
            to accuracy. then disable. 6 words? -->
        <div class="word-container" onclick="select(this)">
            <div class="word" id="word1">Word loading...</div>
            <div class="word" id="word2">Word loading...</div>
            <div class="word" id="word3">Word loading...</div>
            <div class="word" id="word4">Word loading...</div>
            <div class="word" id="word5">Word loading...</div>
            <div class="word" id="word6">Word loading...</div>
        </div>

        <div class="translation-container" onclick="select(this)">
            <div class="translation" id="translation1">Translation loading...</div>
            <div class="translation" id="translation2">Translation loading...</div>
            <div class="translation" id="translation3">Translation loading...</div>
            <div class="translation" id="translation4">Translation loading...</div>
            <div class="translation" id="translation5">Translation loading...</div>
            <div class="translation" id="translation6">Translation loading...</div>
        </div>

        <!-- Navigation -->
        <div class="controls">
            <span id="counter">0 / 0</span> <!--words out of total saved that have been seen-->
            <span id="mistakes">Mistakes: 0</span>
            <button id="next" onclick="newQuiz()">Next</button>
        </div>
    </body>
</html>
